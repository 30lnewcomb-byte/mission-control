name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core-and-build-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test core behavior
        run: dotnet test tests/MissionControl.Core.Tests/MissionControl.Core.Tests.csproj --configuration Release

      - name: Build Windows desktop dashboard
        run: dotnet build src/MissionControl.Desktop/MissionControl.Desktop.csproj --configuration Release
