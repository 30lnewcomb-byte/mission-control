name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core-and-build-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test core behavior
        run: dotnet test tests/MissionControl.Core.Tests/MissionControl.Core.Tests.csproj --configuration Release

      - name: Publish self-contained Windows preview
        shell: pwsh
        run: ./scripts/Publish-MissionControl.ps1

      - name: Upload Windows preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MissionControl-Windows-x64-preview
          path: artifacts/MissionControl-win-x64.zip
          if-no-files-found: error
          retention-days: 14
