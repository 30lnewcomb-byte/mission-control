name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core-and-build-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate PowerShell setup scripts
        shell: pwsh
        run: |
          $scriptPaths = @(
            'scripts/Install-MissionControl.ps1',
            'scripts/Install-OriSmallMC.ps1',
            'scripts/Publish-MissionControl.ps1'
          )
          foreach ($relativePath in $scriptPaths) {
            $scriptPath = Join-Path $env:GITHUB_WORKSPACE $relativePath
            if (-not (Test-Path -LiteralPath $scriptPath -PathType Leaf)) {
              throw "Required PowerShell script not found: $relativePath"
            }
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { $_.Message }) -join [Environment]::NewLine
              throw "PowerShell syntax errors in $($relativePath): $details"
            }
          }

      - name: Test core behavior
        run: dotnet test tests/MissionControl.Core.Tests/MissionControl.Core.Tests.csproj --configuration Release

      - name: Publish self-contained Windows preview
        shell: pwsh
        run: ./scripts/Publish-MissionControl.ps1

      - name: Verify preview ZIP includes app installer and AI files
        shell: pwsh
        run: |
          $zipPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/MissionControl-win-x64.zip'
          $checkDirectory = Join-Path $env:RUNNER_TEMP 'mission-control-package-check'
          if (Test-Path -LiteralPath $checkDirectory) {
            Remove-Item -LiteralPath $checkDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $checkDirectory -Force | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $checkDirectory -Force
          $requiredPaths = @(
            'MissionControl.Desktop.exe',
            'Install-MissionControl.ps1',
            'scripts\Install-OriSmallMC.ps1',
            'models\OriSmallMC.Modelfile',
            'README.txt'
          )
          foreach ($relativePath in $requiredPaths) {
            $fullPath = Join-Path $checkDirectory $relativePath
            if (-not (Test-Path -LiteralPath $fullPath -PathType Leaf)) {
              throw "Preview ZIP is missing required file: $relativePath"
            }
          }

      - name: Upload Windows preview ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MissionControl-Windows-x64-preview
          path: artifacts/MissionControl-win-x64.zip
          if-no-files-found: error
          retention-days: 14
